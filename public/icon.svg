<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradien latar belakang -->
    <linearGradient id="leon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Bayangan halus untuk ikon petir -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Latar belakang rounded rectangle mewah -->
  <rect width="512" height="512" rx="128" fill="url(#leon-grad)" />
  
  <!-- Pola grid aksen futuristik transparan -->
  <g opacity="0.08">
    <line x1="64" y1="0" x2="64" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="128" y1="0" x2="128" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="192" y1="0" x2="192" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="256" y1="0" x2="256" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="320" y1="0" x2="320" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="384" y1="0" x2="384" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="448" y1="0" x2="448" y2="512" stroke="#ffffff" stroke-width="2" />
    
    <line x1="0" y1="64" x2="512" y2="64" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="128" x2="512" y2="128" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="192" x2="512" y2="192" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="256" x2="512" y2="256" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="320" x2="512" y2="320" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="384" x2="512" y2="384" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="448" x2="512" y2="448" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Border bersinar halus (Glow effect) -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.15" />
  
  <!-- Ikon petir pusat yang melambangkan kecepatan dan Leon (Lightning bolt) -->
  <g transform="translate(116, 76) scale(11.6)" filter="url(#shadow)">
    <path d="M13 10V3L4 14h7v7l9-11h-7z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round" />
  </g>
</svg>
